<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>3D Fizik Jarayonlar Simulyatori</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: #fff; font-family: 'Segoe UI', sans-serif; }
    #ui {
      position: absolute; top: 20px; left: 20px; width: 340px;
      background: rgba(15, 23, 42, 0.88); padding: 20px; border-radius: 12px;
      border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 10px 0; font-size: 18px; color: #38bdf8; }
    p { font-size: 13.5px; line-height: 1.5; color: #cbd5e1; margin-bottom: 15px; }
    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    button {
      padding: 10px 14px; border: 1px solid #475569; border-radius: 8px;
      background: #1e293b; color: #f8fafc; cursor: pointer; font-weight: 600;
      text-align: left; transition: 0.2s;
    }
    button:hover { background: #334155; }
    button.active { background: #0284c7; border-color: #38bdf8; }
    .action-btn {
      margin-top: 12px; background: #ea580c; border-color: #fb923c; text-align: center;
    }
    .action-btn:hover { background: #c2410c; }
    #stats {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #334155;
      font-size: 12px; color: #94a3b8;
    }
  </style>
</head>
<body>

<div id="ui">
  <h2 id="title">1. Molekulyar Kengayish</h2>
  <p id="desc">Zich joylashgan zarralar bog'lamlari uzilganda, ular gazga aylanib katta tezlikda kengayadi va yopiq hajm ichida ulkan bosim hosil qiladi.</p>
  
  <div class="btn-group">
    <button id="btn1" class="active" onclick="setMode(1)">1. Molekulyar kengayish (Bosim)</button>
    <button id="btn2" onclick="setMode(2)">2. Siqilish fronti (ZND modeli)</button>
    <button id="btn3" onclick="setMode(3)">3. To'lqin: Itarish va So'rish fazasi</button>
  </div>

  <button class="action-btn" onclick="triggerSimulation()">▶ Qayta ishga tushirish</button>
  <div id="stats">Sichqoncha bilan 3D sahnani aylantiring (Scroll = Zoom)</div>
</div>

<!-- Three.js va OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 12, 28);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Yorug'lik
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(15, 25, 20);
  scene.add(dirLight);

  // Setka (Grid)
  const grid = new THREE.GridHelper(40, 40, 0x334155, 0x1e293b);
  grid.position.y = -6;
  scene.add(grid);

  let currentMode = 1;
  let simTime = 0;
  let objects = [];
  let containerSphere = null;
  let waveSphere = null;
  let suctionSphere = null;

  function clearScene() {
    objects.forEach(obj => scene.remove(obj.mesh));
    objects = [];
    if (containerSphere) { scene.remove(containerSphere); containerSphere = null; }
    if (waveSphere) { scene.remove(waveSphere); waveSphere = null; }
    if (suctionSphere) { scene.remove(suctionSphere); suctionSphere = null; }
    simTime = 0;
  }

  function initMode1() {
    // Tashqi chegaraviy qobiq
    const cageGeo = new THREE.SphereGeometry(6, 24, 24);
    const cageMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.25 });
    containerSphere = new THREE.Mesh(cageGeo, cageMat);
    scene.add(containerSphere);

    // Zich molekulalar
    const pGeo = new THREE.SphereGeometry(0.22, 8, 8);
    for (let i = 0; i < 250; i++) {
      const pMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x052e16 });
      const mesh = new THREE.Mesh(pGeo, pMat);
      // Markazda zich kub shaklda joylashadi
      mesh.position.set((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2);
      
      const dir = mesh.position.clone().normalize().add(new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5)).normalize();
      const speed = 0.12 + Math.random() * 0.15;
      scene.add(mesh);
      objects.push({ mesh, vel: dir.multiplyScalar(speed), active: false });
    }
  }

  function initMode2() {
    // Silindr bo'ylab joylashgan modda zarralari
    const pGeo = new THREE.SphereGeometry(0.25, 10, 10);
    for (let i = 0; i < 300; i++) {
      const x = -12 + Math.random() * 24;
      const r = Math.random() * 3.5;
      const theta = Math.random() * Math.PI * 2;
      const y = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;

      const pMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
      const mesh = new THREE.Mesh(pGeo, pMat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
      objects.push({ mesh, initX: x, excited: false });
    }

    // Zarba fronti tekisligi (Shock front)
    const planeGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.3, 32);
    planeGeo.rotateZ(Math.PI / 2);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 });
    waveSphere = new THREE.Mesh(planeGeo, planeMat);
    waveSphere.position.x = -12;
    scene.add(waveSphere);
  }

  function initMode3() {
    // Atrofdagi test kubiklari (havo qatlamlari va jismlar)
    const boxGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    for (let i = 0; i < 180; i++) {
      const dist = 3 + Math.random() * 13;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI * 0.6;

      const x = dist * Math.cos(phi) * Math.cos(theta);
      const y = dist * Math.sin(phi);
      const z = dist * Math.cos(phi) * Math.sin(theta);

      const boxMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
      const mesh = new THREE.Mesh(boxGeo, boxMat);
      const origPos = new THREE.Vector3(x, y, z);
      mesh.position.copy(origPos);
      scene.add(mesh);
      objects.push({ mesh, origPos, dist });
    }

    // Musbat bosim sferasi (Itarish)
    const wGeo = new THREE.SphereGeometry(1, 32, 32);
    const wMat = new THREE.MeshBasicMaterial({ color: 0xf97316, wireframe: true, transparent: true, opacity: 0.5 });
    waveSphere = new THREE.Mesh(wGeo, wMat);
    scene.add(waveSphere);

    // Manfiy faza sferasi (Vakuum/So'rish)
    const sGeo = new THREE.SphereGeometry(1, 24, 24);
    const sMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true, transparent: true, opacity: 0.3 });
    suctionSphere = new THREE.Mesh(sGeo, sMat);
    scene.add(suctionSphere);
  }

  function setMode(m) {
    currentMode = m;
    document.querySelectorAll('.btn-group button').forEach((b, idx) => {
      b.classList.toggle('active', idx + 1 === m);
    });

    const title = document.getElementById('title');
    const desc = document.getElementById('desc');

    if (m === 1) {
      title.innerText = "1. Molekulyar Kengayish (Bosim)";
      desc.innerText = "Qattiq holatdagi (yashil) molekulalar bog'lamlari uzilgach, qizigan gazga (qizil/sariq) aylanadi. Qobiq ichida qamalib qolgani uchun devorlarga urilib ulkan ichki bosim (GPa) hosil qiladi.";
    } else if (m === 2) {
      title.innerText = "2. Siqilish Fronti (ZND Modeli)";
      desc.innerText = "Ko'k rangli 'Zarba to'lqini' (Shock Front) modda ichida chapdan o'ngga o'ta yuqori tezlikda o'tadi. U tekkan zarralar siqilib qiziydi (sariq/qizil) va gazga aylanib, to'lqinni orqadan itaradi.";
    } else if (m === 3) {
      title.innerText = "3. Friedlander To'lqini: Itarish va So'rish";
      desc.innerText = "To'q sariq sfera — Musbat bosim (jismlarni tashqariga itaradi). Binafsha sfera — uning ortidan keluvchi Manfiy vakuum fazasi (jismlarni markazga qarab orqaga tortadi).";
    }
    triggerSimulation();
  }

  function triggerSimulation() {
    clearScene();
    if (currentMode === 1) initMode1();
    if (currentMode === 2) initMode2();
    if (currentMode === 3) initMode3();
  }

  function animate() {
    requestAnimationFrame(animate);
    simTime += 0.08;

    if (currentMode === 1) {
      objects.forEach(obj => {
        if (simTime > 1.5) {
          obj.mesh.material.color.setHex(0xf97316);
          obj.mesh.material.emissive.setHex(0x7c2d12);
          obj.mesh.position.add(obj.vel);
          // Qobiq devoridan qaytish (Bosim effekti)
          if (obj.mesh.position.length() > 5.7) {
            obj.mesh.position.normalize().multiplyScalar(5.7);
            obj.vel.reflect(obj.mesh.position.clone().normalize());
          }
        }
      });
    } 
    else if (currentMode === 2 && waveSphere) {
      if (waveSphere.position.x < 13) {
        waveSphere.position.x += 0.22;
      }
      objects.forEach(obj => {
        if (obj.mesh.position.x <= waveSphere.position.x && !obj.excited) {
          obj.excited = true;
          obj.mesh.material.color.setHex(0xef4444);
          obj.mesh.material.emissive.setHex(0x991b1b);
        }
        if (obj.excited) {
          // Siqilish va tebranish
          obj.mesh.position.y *= 1.003;
          obj.mesh.position.z *= 1.003;
          obj.mesh.position.x += (Math.random() - 0.45) * 0.12;
        }
      });
    } 
    else if (currentMode === 3 && waveSphere && suctionSphere) {
      const waveRadius = simTime * 2.2;
      const suctionRadius = Math.max(0.1, (simTime - 1.8) * 2.2);

      waveSphere.scale.setScalar(waveRadius);
      suctionSphere.scale.setScalar(suctionRadius);

      objects.forEach(obj => {
        const d = obj.dist;
        const diff = waveRadius - d;
        const dir = obj.origPos.clone().normalize();

        if (diff > 0 && diff < 3.5) {
          // 1. Musbat faza: Tashqariga itarish
          const push = Math.sin((diff / 3.5) * Math.PI) * 2.2;
          obj.mesh.position.copy(obj.origPos).add(dir.multiplyScalar(push));
          obj.mesh.material.color.setHex(0xf97316);
        } else if (diff >= 3.5 && diff < 8.0) {
          // 2. Manfiy faza (Vakuum): Markazga qarab orqaga tortilish
          const pull = Math.sin(((diff - 3.5) / 4.5) * Math.PI) * 1.4;
          obj.mesh.position.copy(obj.origPos).sub(dir.multiplyScalar(pull));
          obj.mesh.material.color.setHex(0xa855f7);
        } else {
          // Asl holatiga qaytish
          obj.mesh.position.lerp(obj.origPos, 0.1);
          obj.mesh.material.color.setHex(0x94a3b8);
        }
      });
    }

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  triggerSimulation();
  animate();
</script>
</body>
</html>
